name: MDD feed
on:
  schedule:
    - cron: '40 21 * * 1-5'   # 미국 장 마감 후 (KST 06:40)
    - cron: '10 7 * * 1-5'    # 한국 장 마감 후 (KST 16:10)
    - cron: '20 0 * * 0,6'    # 주말 코인
  workflow_dispatch:
permissions:
  contents: write
concurrency: mdd-feed
jobs:
  feed:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/mdd-feed.mjs
      - run: |
          git config user.name 'mdd-feed-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add mdd/feed/latest.json
          git diff --cached --quiet || (git commit -m 'Update MDD feed' && git push)
